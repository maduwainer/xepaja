# Override de producao na VPS SEM Caddy proprio: o proxy central
# (projects/vps/caddy, rede `edge`) e dono das portas 80/443 e faz
# reverse_proxy para a app. Este arquivo so ajusta a app para prod.
# Uso na VPS: .env com XEPAJA_URL=https://xepaja.com, COOKIE_SECURE=1,
# POSTGRES_PASSWORD forte e RESEND_* preenchidos (ver .env.example).
# Deploy: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# A app entra na rede externa `edge` (criada pelo compose do proxy central).
# Local sem dominio: nao use este arquivo (suba so db + bun run watch).
services:
  # Na VPS a app nao publica a porta direta; so o proxy central atende 80/443.
  app:
    ports: []
    environment:
      COOKIE_SECURE: "1"
    networks:
      - default
      - edge

networks:
  edge:
    external: true
